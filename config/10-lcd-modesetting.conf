Section "ServerLayout"
    Identifier "LCD"
    Screen 0 "HDMI Screen"
    Option "AutoAddGPU" "false"
EndSection

Section "Device"
    Identifier "HDMI Panel"
    Driver "modesetting"
    Option "kmsdev" "/dev/dri/card1"
    Option "AccelMethod" "none"
EndSection

Section "Monitor"
    Identifier "HDMI Monitor"
    # 720p for lighter mirroring bandwidth + better panel aspect fit
    Modeline "1280x720_60" 74.50 1280 1344 1472 1664 720 723 728 748 -hsync +vsync
    Option "PreferredMode" "1280x720_60"
EndSection

Section "Screen"
    Identifier "HDMI Screen"
    Device "HDMI Panel"
    Monitor "HDMI Monitor"
    DefaultDepth 24
    SubSection "Display"
        Depth 24
        Modes "1280x720_60" "1920x1080" "1280x1024" "1024x768"
    EndSubSection
EndSection
